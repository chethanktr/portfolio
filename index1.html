<!-- Copy this block and paste after the last certificate-slide -->
<div class="certificate-slide">
    <div class="certificate-header">
        <div class="certificate-icon">
            <i class="fas fa-certificate"></i> <!-- Change icon as needed -->
        </div>
        <h3 class="certificate-title">Your Certificate Title</h3>
        <p class="certificate-issuer">Issuing Organization | Issued Year</p>
    </div>
    
    <!-- Image: cer5.JPG -->
    <img src="cer5.JPG" alt="Certificate Description" class="certificate-image" 
         onclick="window.open('YOUR_VERIFICATION_LINK', '_blank')">
    
    <div class="certificate-details">
        <h4>Skills Covered:</h4>
        <ul class="skills-list">
            <li>Skill 1</li>
            <li>Skill 2</li>
            <li>Skill 3</li>
            <!-- Add more skills as needed -->
        </ul>
    </div>
</div>
